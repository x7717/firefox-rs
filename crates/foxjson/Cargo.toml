[package]
name = "foxjson"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast single-pass JSON parser for Firefox hot paths (session store, prefs, telemetry)"
publish = false

[dependencies]

[lib]
bench = false # юнит-тесты lib не должны запускаться в bench-режиме (ломают --output-format bencher)

[dev-dependencies]
criterion = "0.5"
serde = "1"
serde_json = "1"

[[bench]]
name = "json"
harness = false
