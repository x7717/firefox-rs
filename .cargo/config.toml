# Итерация 18 (сессия 14): стабилизация бенчмарков против layout-лото ВМ.
#
# Уроки сессий 11-13: сдвиг кода на +29 байт менял corpus-all на +-18%
# при неизменных абсолютных временах отдельных URL (layout-лотерея),
# структурные выигрыши 5-10% были неотделимы от шума.
#
# Флаги (измерено, parse/foxurl/corpus-all, 3 нейтральных pad-возмущения):
#   - codegen-units=1       : один CGU на крейт — детерминичный кодgen,
#                             убирает лотерею CGU-партиционирования;
#   - llvm-args=-align-all-functions=6 : каждый вход функции на границе
#                             64Б — фиксирует выравнивание горячих входов
#                             независимо от размеров соседних функций.
# Эффект: разброс corpus-all между возмущениями 3.84% -> 2.06% (половина),
# абсолют -7% (783 vs 845 ns). Флаги применяются и к CI Benchmark —
# история бенчей сопоставима между прогонами.
#
# ВАЖНО: env RUSTFLAGS (если задан) ПОЛНОСТЬЮ перекрывает этот список —
# проф-сборки (docs/PROFILING.md, не-PIE) продолжают работать как раньше.
[build]
rustflags = ["-C", "codegen-units=1", "-C", "llvm-args=-align-all-functions=6"]
